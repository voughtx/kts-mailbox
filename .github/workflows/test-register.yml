name: Test Register from Runner IP

on:
  workflow_dispatch:
    inputs:
      token:
        description: 'Fresh Turnstile token'
        required: true

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Register from runner IP
        env:
          TOKEN: ${{ github.event.inputs.token }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 runner_register.py
