name: Kartoons Auto-Register

on:
  workflow_dispatch:
    inputs:
      token:
        description: 'Fresh Turnstile token (optional — blank = auto from inbox)'
        required: false
        default: ''
  push:
    paths:
      - 'inbox.txt'

concurrency:
  group: kts-register
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Auto register (inbox se token)
        env:
          TOKEN: ${{ github.event.inputs.token }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 runner_register.py
