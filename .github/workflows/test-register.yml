name: Register (hub)

on:
  schedule:
    - cron: "*/2 * * * *"
  workflow_dispatch:
    inputs:
      token:
        description: 'Fresh Turnstile token (optional)'
        required: false
        default: ''

jobs:
  hub:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch runner
        run: |
          curl -sL -H "Authorization: token ${{ secrets.GH_PAT }}" \
            "https://raw.githubusercontent.com/${{ github.repository }}/main/runner_register.py" \
            -o runner_register.py
      - name: Run hub (dispatch + batch claim)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          HUB_REPO: voughtx/kts-mailbox
          SIBLINGS: voughtx/kts-mailbox-2,voughtx/kts-mailbox-3,voughtx/kts-mailbox-4,voughtx/kts-mailbox-5
          RUNNER_ID: kts-mailbox
          TOKEN: ${{ github.event.inputs.token }}
          BATCH: "6"
        run: |
          python3 runner_register.py
